[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "MCP server for the Google Ads API — leitura e operação de campanhas, anúncios e palavras-chave das contas sob a MCC da agência."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "pydantic-monty==0.0.7",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp"]
