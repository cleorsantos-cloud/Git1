[project]
name = "brasilapi-mcp"
version = "0.1.0"
description = "MCP server for BrasilAPI (public Brazilian API, no auth) — spec-driven, Code Mode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "pydantic-monty==0.0.7",
]

[project.scripts]
brasilapi-mcp = "brasilapi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brasilapi_mcp"]
