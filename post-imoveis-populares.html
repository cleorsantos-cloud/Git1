<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Post Imóveis Populares — Bona Vita</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #080c07;
    }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      /* Warm dark — terra, não tecnologia */
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%, #1a1206 0%, #080c07 68%);
    }

    /* Warm ambient behind the house */
    .bloom {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      width: 680px;
      height: 480px;
      background: radial-gradient(ellipse at center,
        rgba(245, 158, 11, 0.13) 0%,
        rgba(74, 222, 128, 0.06) 55%,
        transparent 72%
      );
      filter: blur(50px);
      pointer-events: none;
    }

    /* Subtle ground horizon */
    .horizon {
      position: absolute;
      bottom: 210px;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right,
        transparent 8%,
        rgba(245, 158, 11, 0.12) 30%,
        rgba(74, 222, 128, 0.10) 70%,
        transparent 92%
      );
    }

    /* Subtle dot grid — cidade ao fundo */
    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 20%, transparent 75%);
    }

    /* Corner marks */
    .flag {
      position: absolute;
      width: 26px;
      height: 26px;
    }
    .flag-tl { top: 36px; left: 36px;
      border-top: 1.5px solid rgba(245,158,11,0.4);
      border-left: 1.5px solid rgba(245,158,11,0.4); }
    .flag-tr { top: 36px; right: 36px;
      border-top: 1.5px solid rgba(245,158,11,0.4);
      border-right: 1.5px solid rgba(245,158,11,0.4); }
    .flag-bl { bottom: 36px; left: 36px;
      border-bottom: 1.5px solid rgba(74,222,128,0.35);
      border-left: 1.5px solid rgba(74,222,128,0.35); }
    .flag-br { bottom: 36px; right: 36px;
      border-bottom: 1.5px solid rgba(74,222,128,0.35);
      border-right: 1.5px solid rgba(74,222,128,0.35); }

    /* House SVG hero */
    .house-wrap {
      position: absolute;
      top: 136px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 240px;
    }

    .house-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter:
        drop-shadow(0 0 16px rgba(245, 158, 11, 0.55))
        drop-shadow(0 0 56px rgba(245, 158, 11, 0.22))
        drop-shadow(0 0 100px rgba(74, 222, 128, 0.12));
    }

    /* Key icon, subtle, bottom-left of house */
    .key-wrap {
      position: absolute;
      top: 330px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.55;
    }
    .key-wrap svg {
      filter: drop-shadow(0 0 6px rgba(245,158,11,0.4));
    }

    /* Text */
    .content {
      position: absolute;
      top: 400px;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 88px;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 26px;
    }

    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 116px;
      line-height: 0.86;
      letter-spacing: 0.01em;
      color: #ffffff;
      margin-bottom: 36px;
    }

    .headline .gold {
      display: block;
      background: linear-gradient(110deg, #f59e0b 20%, #fbbf24 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .headline .green {
      display: block;
      background: linear-gradient(110deg, #4ade80 20%, #2563eb 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 300;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.07em;
      margin-bottom: 20px;
    }

    .pills {
      display: flex;
      gap: 16px;
      margin-bottom: 64px;
    }

    .pill {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f59e0b;
      border: 1px solid rgba(245,158,11,0.3);
      padding: 7px 18px;
      border-radius: 40px;
    }

    .pill.alt {
      color: #4ade80;
      border-color: rgba(74,222,128,0.3);
    }

    /* Tick */
    .tick {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom,
        rgba(245,158,11,0.7),
        rgba(74,222,128,0.7)
      );
      margin: 0 auto 30px;
    }

    /* Brand */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Inline ∞ */
    .brand-inf {
      display: inline-block;
    }

    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 0.16em;
      color: #4ade80;
    }

    .brand-sub {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
<div class="canvas">

  <div class="grid"></div>
  <div class="bloom"></div>
  <div class="horizon"></div>

  <div class="flag flag-tl"></div>
  <div class="flag flag-tr"></div>
  <div class="flag flag-bl"></div>
  <div class="flag flag-br"></div>

  <!-- Casa como ícone hero -->
  <div class="house-wrap">
    <svg viewBox="0 0 260 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#fbbf24"/>
          <stop offset="60%"  stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#4ade80"/>
        </linearGradient>
        <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#fde68a"/>
          <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
      </defs>

      <!-- Telhado -->
      <polyline
        points="18,120 130,18 242,120"
        fill="none"
        stroke="url(#roofGrad)"
        stroke-width="9"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Corpo da casa -->
      <rect x="44" y="118" width="172" height="106" rx="4"
        fill="none"
        stroke="url(#houseGrad)"
        stroke-width="9"
        stroke-linejoin="round"
      />

      <!-- Porta -->
      <rect x="106" y="164" width="48" height="60" rx="4"
        fill="none"
        stroke="url(#houseGrad)"
        stroke-width="6"
      />

      <!-- Maçaneta -->
      <circle cx="148" cy="196" r="5"
        fill="#f59e0b"
        opacity="0.9"
      />

      <!-- Janelas -->
      <rect x="60" y="142" width="34" height="30" rx="3"
        fill="none"
        stroke="url(#houseGrad)"
        stroke-width="5"
        opacity="0.7"
      />
      <rect x="166" y="142" width="34" height="30" rx="3"
        fill="none"
        stroke="url(#houseGrad)"
        stroke-width="5"
        opacity="0.7"
      />

      <!-- Chaminé -->
      <rect x="170" y="36" width="22" height="48" rx="2"
        fill="none"
        stroke="#fbbf24"
        stroke-width="6"
        opacity="0.6"
      />

      <!-- Estrela / brilho no topo -->
      <circle cx="130" cy="18" r="7" fill="#fde68a" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </svg>
  </div>

  <!-- Chave pequena abaixo da casa -->
  <div class="key-wrap">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="13" cy="13" r="9" stroke="#f59e0b" stroke-width="2.5"/>
      <line x1="20" y1="20" x2="32" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="27" y1="27" x2="27" y2="31" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <line x1="31" y1="27" x2="31" y2="30" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Copy -->
  <div class="content">
    <p class="eyebrow">🏠 &nbsp; Imóveis Populares</p>

    <h1 class="headline">
      <span class="gold">Sua casa</span>
      do jeito
      <span class="green">que cabe</span>
    </h1>

    <p class="sub">Financiamento facilitado · Entrada acessível</p>

    <div class="pills">
      <div class="pill">Minha Casa Minha Vida</div>
      <div class="pill alt">FGTS Aceito</div>
    </div>

    <div class="tick"></div>

    <div class="brand">
      <div class="brand-row">
        <!-- ∞ inline -->
        <svg class="brand-inf" width="28" height="14" viewBox="0 0 60 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30,14 C30,14 24,4 16,4 C8,4 2,9 2,14 C2,19 8,24 16,24 C24,24 30,14 30,14 C30,14 36,4 44,4 C52,4 58,9 58,14 C58,19 52,24 44,24 C36,24 30,14 30,14Z"
            fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <div class="brand-name">Bona Vita</div>
      </div>
      <div class="brand-sub">Digital Marketing Agency</div>
    </div>
  </div>

</div>
</body>
</html>
