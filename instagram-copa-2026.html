<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Bona Vita × Copa do Mundo 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #04101e;
    }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse 90% 65% at 50% 25%, #0c2240 0%, #04101e 65%);
    }

    /* Abstract field arcs at bottom — not literal grass, just geometry */
    .arc {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(74, 222, 128, 0.055);
      bottom: -440px;
      left: 50%;
      transform: translateX(-50%);
    }
    .arc-1 { width: 1300px; height: 1300px; }
    .arc-2 { width: 960px;  height: 960px;  border-color: rgba(37, 99, 235, 0.04); }
    .arc-3 { width: 640px;  height: 640px; }

    .midline {
      position: absolute;
      bottom: 190px;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right,
        transparent 5%,
        rgba(74, 222, 128, 0.07) 30%,
        rgba(37, 99, 235, 0.07) 70%,
        transparent 95%
      );
    }

    /* Ambient bloom behind the ∞ */
    .bloom {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 720px;
      height: 420px;
      background: radial-gradient(ellipse at center,
        rgba(74, 222, 128, 0.09) 0%,
        rgba(37, 99, 235, 0.06) 45%,
        transparent 70%
      );
      filter: blur(48px);
      pointer-events: none;
    }

    /* Corner flag marks — nod to the pitch without being literal */
    .flag {
      position: absolute;
      width: 28px;
      height: 28px;
    }
    .flag-tl { top: 36px; left: 36px;
      border-top: 1.5px solid rgba(74, 222, 128, 0.35);
      border-left: 1.5px solid rgba(74, 222, 128, 0.35); }
    .flag-tr { top: 36px; right: 36px;
      border-top: 1.5px solid rgba(74, 222, 128, 0.35);
      border-right: 1.5px solid rgba(74, 222, 128, 0.35); }
    .flag-bl { bottom: 36px; left: 36px;
      border-bottom: 1.5px solid rgba(37, 99, 235, 0.35);
      border-left: 1.5px solid rgba(37, 99, 235, 0.35); }
    .flag-br { bottom: 36px; right: 36px;
      border-bottom: 1.5px solid rgba(37, 99, 235, 0.35);
      border-right: 1.5px solid rgba(37, 99, 235, 0.35); }

    /* ∞ hero */
    .infinity-wrap {
      position: absolute;
      top: 148px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 240px;
    }

    .infinity-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter:
        drop-shadow(0 0 14px rgba(74, 222, 128, 0.55))
        drop-shadow(0 0 48px rgba(74, 222, 128, 0.22))
        drop-shadow(0 0 90px rgba(37, 99, 235, 0.18));
    }

    /* Text block */
    .content {
      position: absolute;
      top: 424px;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 90px;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 30px;
    }

    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 108px;
      line-height: 0.87;
      letter-spacing: 0.015em;
      color: #ffffff;
      margin-bottom: 38px;
    }

    .headline .gradient-line {
      display: block;
      background: linear-gradient(110deg, #4ade80 10%, #2563eb 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 300;
      font-style: italic;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.06em;
      margin-bottom: 72px;
    }

    /* Gradient vertical tick */
    .tick {
      width: 1px;
      height: 52px;
      background: linear-gradient(to bottom,
        rgba(74, 222, 128, 0.7),
        rgba(37, 99, 235, 0.7)
      );
      margin: 0 auto 36px;
    }

    /* Brand */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 0.18em;
      color: #4ade80;
    }

    .brand-sub {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
<div class="canvas">

  <!-- Pitch geometry -->
  <div class="arc arc-1"></div>
  <div class="arc arc-2"></div>
  <div class="arc arc-3"></div>
  <div class="midline"></div>

  <!-- Bloom -->
  <div class="bloom"></div>

  <!-- Corners -->
  <div class="flag flag-tl"></div>
  <div class="flag flag-tr"></div>
  <div class="flag flag-bl"></div>
  <div class="flag flag-br"></div>

  <!-- ∞ symbol with animated ball -->
  <div class="infinity-wrap">
    <svg viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="iGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#2563eb"/>
          <stop offset="50%"  stop-color="#4ade80"/>
          <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>

        <!-- The ∞ path used for both stroke and motion -->
        <path id="iPath"
          d="M260,120
             C260,120 222,40 158,40
             C90,40 36,76 36,120
             C36,164 90,200 158,200
             C222,200 260,120 260,120
             C260,120 298,40 362,40
             C430,40 484,76 484,120
             C484,164 430,200 362,200
             C298,200 260,120 260,120Z"
        />
      </defs>

      <!-- Faint fill for depth -->
      <use href="#iPath" fill="rgba(74,222,128,0.025)"/>

      <!-- Main stroke -->
      <use href="#iPath"
        fill="none"
        stroke="url(#iGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Orbiting ball -->
      <circle r="10" fill="#ffffff" opacity="0.92">
        <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
          <mpath href="#iPath"/>
        </animateMotion>
      </circle>

      <!-- Ball glow -->
      <circle r="18" fill="rgba(255,255,255,0.12)">
        <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
          <mpath href="#iPath"/>
        </animateMotion>
      </circle>
    </svg>
  </div>

  <!-- Copy -->
  <div class="content">
    <p class="eyebrow">⚽ &nbsp; Copa do Mundo 2026 &nbsp; ⚽</p>

    <h1 class="headline">
      O infinito<br>
      <span class="gradient-line">é o nosso</span><br>
      campo
    </h1>

    <p class="tagline">Marketing que vai além dos 90 minutos</p>

    <div class="tick"></div>

    <div class="brand">
      <div class="brand-name">Bona Vita</div>
      <div class="brand-sub">Digital Marketing Agency</div>
    </div>
  </div>

</div>
</body>
</html>
